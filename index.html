    <title>PronoFX Dbot</title>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #0b0e11;
        color: #f2f3f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot-splash img {
        width: clamp(110px, 24vw, 150px);
        height: clamp(110px, 24vw, 150px);
        object-fit: cover;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      }
      .boot-splash h1 { font-size: clamp(20px, 5vw, 28px); margin: 14px 0 0; letter-spacing: -0.03em; }
      .boot-splash h1 span { color: #ff444f; }
      .boot-splash small { color: #8b93a1; font-size: 12px; margin: 2px 0 24px; }
      .boot-bar {
        width: min(240px, 68vw);
        height: 5px;
        border-radius: 999px;
        background: #181d24;
        overflow: hidden;
        position: relative;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff444f, #4c6ef5);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.body.style.background = light ? '#f4f5f7' : '#0b0e11';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/assests/logo%202000x2000.jpg" alt="PronoFX Dbot" />
        <h1>PronoFX <span>Dbot</span></h1>
        <small>Launching your trading command center&hellip;</small>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
